name: CI
on:
  push:
    branches:
      - '**'
    tags: ['*']
  pull_request:
  schedule:
    - cron: '0 0 1 * *'  # Runs at midnight UTC on the 1st of every month
  workflow_dispatch:       # Allows manual trigger from the Actions tab
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        exclude:
          - os: macOS-latest
            arch: x86
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # Fathom is an unregistered test dependency (used for plot theming); check it out
      - name: Check out and develop Fathom
        shell: bash
        env:
          FATHOM_PATH: ${{ runner.temp }}/Fathom
        run: |
          git clone --depth 1 https://github.com/brendanjohnharris/Fathom.jl "$FATHOM_PATH"
          julia --color=yes --project=. -e 'using Pkg; Pkg.develop(path = ENV["FATHOM_PATH"])'
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
